[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp"
version = "0.1.0"
description = "A from-scratch, tutorial-grade framework for multi-token prediction (MTP): training objectives, MTP heads, and self-speculative decoding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yu Shi Jie" }]
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["mtp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
